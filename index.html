<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhamaka Fireworks - Diwali Crackers Online, Ahmedabad</title>
<meta name="description" content="Buy Sivakasi crackers, sky shots, flower pots and Diwali gift boxes online. Store in Vastrapur, Ahmedabad. Delivery across India.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Rozha+One&display=swap" rel="stylesheet">
<!-- PayQ: QR code renderer (payment itself runs through /api/create-order and /api/order-status) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="products.js"></script>
<style>
:root{
  --night:#0d0720; --violet:#1a0d3d; --violet2:#241150; --line:rgba(255,236,200,.12);
  --marigold:#ffb21e; --saffron:#ff7a1a; --rani:#e8267a; --kumkum:#d6342c; --leaf:#19c3a6;
  --cream:#fbf1dc; --muted:#bfb0da;
  --glow:linear-gradient(120deg,#ffb21e,#ff7a1a 50%,#e8267a);
  --serif:'Rozha One',Georgia,serif; --sans:'Hind','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:var(--sans);font-size:16px;line-height:1.55;background:var(--night);color:var(--cream);overflow-x:hidden;
  background-image:radial-gradient(900px 500px at 85% -5%,rgba(232,38,122,.20),transparent 60%),radial-gradient(800px 500px at -5% 8%,rgba(255,122,26,.17),transparent 60%)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--marigold);outline-offset:3px;border-radius:6px}
.wrap{width:min(1200px,92vw);margin-inline:auto}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.12;letter-spacing:.2px}
.muted{color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;cursor:pointer;font-weight:600;color:#2a1000;
  background:var(--glow);padding:.7rem 1.25rem;border-radius:999px;box-shadow:0 8px 24px -8px rgba(255,122,26,.7);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px -8px rgba(255,122,26,.9)}
.btn.lg{padding:.95rem 1.8rem;font-size:1.05rem}
.btn.sm{padding:.5rem 1rem;font-size:.92rem;width:100%}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 1.5px rgba(255,236,200,.35)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--marigold);color:var(--marigold)}
.btn[disabled]{opacity:.6;cursor:wait;transform:none}

/* header */
header.site{position:sticky;top:0;z-index:50;background:rgba(13,7,32,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar{background:linear-gradient(90deg,#3a0f3f,#5a1240 50%,#3a0f3f);font-size:.85rem}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-block:.35rem}
.loc{display:flex;align-items:center;gap:.4rem;min-width:0;color:#ffe4b0}
.loc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc:hover{color:#fff}
.loc svg{flex:none;width:16px;height:16px}
.tb-right{display:flex;align-items:center;gap:.9rem;flex:none}
.social{display:flex;gap:.35rem}
.social a{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.08);transition:background .2s,color .2s}
.social a:hover{background:var(--marigold);color:#2a1000}
.social svg{width:15px;height:15px}
.nav{display:flex;align-items:center;gap:1.2rem;padding-block:.7rem}
.logo{display:flex;align-items:center;gap:.55rem;font-family:var(--serif);font-size:1.45rem;white-space:nowrap}
.logo i{font-style:normal;font-size:1.6rem;filter:drop-shadow(0 0 10px rgba(255,178,30,.8))}
.nav-links{display:flex;align-items:center;gap:1.4rem;margin-left:1rem}
.nav-links>a,.dd>a{font-weight:500;color:#eadcc0;padding:.3rem 0;border-bottom:2px solid transparent}
.nav-links>a:hover,.dd>a:hover,.nav-links a.on{color:var(--marigold);border-color:var(--marigold)}
.dd{position:relative}
.dd-menu{display:none;position:absolute;top:100%;left:-1rem;width:290px;padding:.6rem;background:var(--violet);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 40px rgba(0,0,0,.5);grid-template-columns:1fr;gap:.1rem}
.dd:hover .dd-menu,.dd:focus-within .dd-menu{display:grid}
.dd-menu a{display:flex;gap:.6rem;align-items:center;padding:.5rem .7rem;border-radius:10px}
.dd-menu a:hover{background:rgba(255,178,30,.12);color:var(--marigold)}
.nav-spacer{flex:1}
.search{position:relative;width:min(260px,28vw)}
.search input{width:100%;padding:.55rem 1rem .55rem 2.3rem;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);outline:none}
.search input:focus{border-color:var(--marigold)}
.search svg{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.cart-btn{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.cart-btn:hover{border-color:var(--marigold)}
.cart-btn svg{width:22px;height:22px}
.cart-btn b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--rani);font-size:.75rem;display:grid;place-items:center}
.burger{display:none;background:none;border:1px solid var(--line);width:44px;height:44px;border-radius:50%;cursor:pointer}

/* hero */
.hero{position:relative;overflow:hidden;min-height:620px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:2rem;align-items:center;padding-block:3.5rem;pointer-events:none}
.hero-in a,.hero-in button{pointer-events:auto}
.hero h1{font-size:clamp(2.6rem,6.2vw,5rem);text-shadow:0 4px 40px rgba(232,38,122,.45)}
.hero h1 em{font-style:normal;background:var(--glow);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{margin-top:1.2rem;font-size:1.15rem;max-width:34ch;color:#eadcc0}
.cta{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem}
.hero-facts{display:flex;flex-wrap:wrap;gap:1.6rem;margin-top:2.2rem;color:var(--muted);font-size:.95rem}
.hero-facts b{display:block;font-family:var(--serif);font-weight:400;font-size:1.5rem;color:var(--marigold)}
.hero-art{position:relative;height:430px}
.hero-art .pc{background:#fff;position:absolute;width:56%;aspect-ratio:1/1;border-radius:26px;overflow:hidden;border:1px solid rgba(255,236,200,.25);box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.hero-art .pc img{width:100%;height:100%;object-fit:contain}
.pc.a{left:0;top:6%;transform:rotate(-7deg);animation:bob 6s ease-in-out infinite}
.pc.b{right:0;top:0;transform:rotate(6deg);animation:bob 7s ease-in-out -2s infinite}
.pc.c{left:22%;bottom:0;transform:rotate(-2deg);animation:bob 8s ease-in-out -4s infinite;z-index:2}
@keyframes bob{50%{translate:0 -12px}}
.seal{position:absolute;right:2%;bottom:8%;z-index:3;width:128px;height:128px;border-radius:50%;background:var(--glow);color:#2a1000;display:grid;place-content:center;text-align:center;line-height:1;box-shadow:0 0 0 6px rgba(255,178,30,.25),0 14px 30px rgba(0,0,0,.5);transform:rotate(10deg)}
.seal small{font-size:.8rem;font-weight:600}.seal b{font-family:var(--serif);font-weight:400;font-size:2.4rem}

/* ticker */
.ticker{overflow:hidden;background:var(--marigold);color:#2a1000;font-weight:600;border-block:1px solid #ffd98a}
.ticker div{display:flex;width:max-content;animation:tick 32s linear infinite}
.ticker span{padding:.55rem 2.2rem;white-space:nowrap}
@keyframes tick{to{transform:translateX(-50%)}}

/* sections */
section.blk{padding-block:4rem}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1.8rem;flex-wrap:wrap}
.sec-h h2{font-size:clamp(1.8rem,3.4vw,2.6rem)}
.sec-h a{color:var(--marigold);font-weight:600}
.sec-h a:hover{text-decoration:underline}

.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.cat{position:relative;overflow:hidden;isolation:isolate;min-height:220px;padding:1.3rem;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(160deg,var(--c1),var(--c2));color:#fff;transition:transform .25s,box-shadow .25s}
.cat:nth-child(odd){border-radius:30px 8px 30px 8px}
.cat:nth-child(even){border-radius:8px 30px 8px 30px}
.cat:hover{transform:translateY(-5px);box-shadow:0 20px 40px -16px var(--c2)}
.cat-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .6s}
.cat::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(10,4,25,.82),rgba(10,4,25,0) 62%)}
.cat:hover .cat-img{transform:scale(1.07)}
.cat.cut .cat-img{inset:auto;right:5%;top:6%;width:46%;height:84%;object-fit:contain;mix-blend-mode:multiply;z-index:-1}
.cat.cut::after{z-index:-2;background:linear-gradient(90deg,rgba(10,4,25,.6),rgba(10,4,25,0) 58%)}
.cat h3{font-size:1.55rem}.cat small{opacity:.92}
.budget{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.budget a{display:flex;flex-direction:column;gap:.15rem;padding:1.3rem;border-radius:22px;background:linear-gradient(160deg,var(--violet2),var(--violet));border:1px solid var(--line);transition:transform .2s,border-color .2s}
.budget a:hover{transform:translateY(-4px);border-color:var(--marigold)}
.budget span{font-size:1.8rem}.budget b{font-family:var(--serif);font-weight:400;font-size:1.6rem}.budget small{color:var(--muted)}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}

/* sale banner */
.sale-in{display:grid;grid-template-columns:1.3fr 1fr;gap:2rem;align-items:center;padding:2.6rem;border-radius:34px;position:relative;overflow:hidden;
  background:radial-gradient(500px 260px at 90% 0%,rgba(255,178,30,.5),transparent 70%),linear-gradient(120deg,#6a0f45,#b3195f 55%,#e8561f)}
.sale-in h2{font-size:clamp(2rem,4vw,3.1rem)}
.sale-in p{margin:.8rem 0 1.4rem;max-width:46ch;color:#ffe9d0}
.code{display:inline-block;padding:.1rem .6rem;border:1.5px dashed var(--marigold);border-radius:8px;color:var(--marigold);font-weight:700;letter-spacing:1px}
.cd{text-align:center}
.cd-row{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.cd-row div{background:rgba(13,7,32,.55);border:1px solid rgba(255,236,200,.25);border-radius:16px;padding:.8rem .2rem}
.cd-row b{display:block;font-family:var(--serif);font-weight:400;font-size:2.2rem;line-height:1}
.cd-row span{font-size:.8rem;color:#ffd9a8}
.cd small{display:block;margin-top:.8rem;color:#ffe3c4}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:1.2rem}
.card{background:var(--violet);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.card:hover{border-color:rgba(255,178,30,.55);transform:translateY(-3px)}
.card-img{position:relative;aspect-ratio:1/1;overflow:hidden;background:#fff}
.card-img img{width:100%;height:100%;object-fit:contain;transition:transform .5s}
.card:hover .card-img img{transform:scale(1.06)}
.badge{position:absolute;left:10px;top:10px;background:var(--rani);font-weight:700;font-size:.82rem;padding:.15rem .6rem;border-radius:99px}
.eco{position:absolute;right:10px;top:10px;background:rgba(25,195,166,.92);color:#04251f;font-weight:600;font-size:.78rem;padding:.15rem .55rem;border-radius:99px}
.card-b{padding:1rem 1rem 1.1rem;display:flex;flex-direction:column;gap:.2rem;flex:1}
.card-t{font-weight:600;font-size:1.04rem;line-height:1.3}
.card-t:hover{color:var(--marigold)}
.pack{font-size:.88rem;color:var(--muted)}
.rate{font-size:.88rem;color:var(--marigold)}.rate span{color:var(--muted)}
.price{display:flex;align-items:baseline;gap:.5rem;margin:.3rem 0 .7rem}
.price b{font-size:1.3rem}.price s{color:var(--muted);font-size:.95rem}
.card-b .btn{margin-top:auto}

.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem}
.gift{display:grid;grid-template-columns:1fr 1fr;border-radius:26px;overflow:hidden;background:var(--violet2);border:1px solid var(--line)}
.gift img{height:100%;width:100%;object-fit:contain;background:#fff}
.gift div{padding:1.2rem;display:flex;flex-direction:column;gap:.3rem;justify-content:center}
.gift h3{font-size:1.2rem}

.why{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem}
.why div{padding:1.2rem 0;border-top:2px solid var(--marigold)}
.why h3{font-size:1.15rem;margin:.4rem 0 .3rem}
.why p{color:var(--muted);font-size:.95rem}
.why i{font-style:normal;font-size:1.8rem}

.visit{display:grid;grid-template-columns:1fr 1.2fr;gap:2rem;align-items:stretch}
.visit .info{display:flex;flex-direction:column;gap:1rem}
.map{border-radius:26px;overflow:hidden;border:1px solid var(--line);min-height:320px;background:var(--violet)}
.map iframe{width:100%;height:100%;min-height:320px;border:0;filter:invert(.9) hue-rotate(180deg) saturate(.8)}
.tips{display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem 1.5rem;margin-top:.4rem;color:#eadcc0}
.tips li{list-style:none;padding-left:1.5rem;position:relative}
.tips li::before{content:'🪔';position:absolute;left:0;font-size:.9rem}

.brand{font-size:.8rem;color:var(--marigold);font-weight:600}
a.brand:hover{text-decoration:underline}
.pager{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin:2rem 0 0}
/* page head, shop */
.page-h{padding:2.4rem 0 1.2rem}
.page-h h1{font-size:clamp(2rem,4vw,3rem)}
.crumbs{font-size:.9rem;color:var(--muted);margin-bottom:.6rem}
.crumbs a:hover{color:var(--marigold)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
.chip{padding:.4rem 1rem;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:.95rem;cursor:pointer}
.chip:hover{border-color:var(--marigold)}
.chip.on{background:var(--marigold);color:#2a1000;border-color:var(--marigold);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:.8rem 1.2rem;align-items:center;justify-content:space-between;margin:.5rem 0 1.4rem;padding:.9rem 1.1rem;background:var(--violet);border:1px solid var(--line);border-radius:16px}
.toolbar label{display:flex;gap:.5rem;align-items:center;color:var(--muted);font-size:.92rem}
select{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:.45rem .7rem;color:var(--cream)}
.mini-sale{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.9rem 1.3rem;border-radius:16px;background:linear-gradient(100deg,#6a0f45,#c0261f);margin-bottom:1rem}
.empty{padding:4rem 1rem;text-align:center;color:var(--muted)}
.empty h3{font-size:1.6rem;color:var(--cream);margin-bottom:.5rem}

/* product page */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:2.4rem;padding-bottom:2rem}
.gal .main{border-radius:26px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1/1;background:#fff}
.gal .main img{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:.7rem;margin-top:.8rem}
.thumbs button{width:84px;aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid var(--line);padding:0;cursor:pointer;background:#fff}
.thumbs button.on{border-color:var(--marigold)}
.thumbs img{width:100%;height:100%;object-fit:contain}
.pd h1{font-size:clamp(1.9rem,3.4vw,2.8rem);margin-bottom:.4rem}
.pd .price b{font-size:2.1rem}.pd .price s{font-size:1.1rem}
.save{color:var(--leaf);font-weight:600}
.tags{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
.tag{font-size:.85rem;padding:.15rem .7rem;border-radius:99px;background:rgba(255,255,255,.07)}
.buy{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin:1.4rem 0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.05)}
.qty button{width:40px;height:40px;border:0;background:none;font-size:1.2rem;cursor:pointer;border-radius:50%}
.qty button:hover{color:var(--marigold)}
.qty span{min-width:30px;text-align:center;font-weight:600}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:1.2rem}
.trust div{padding:.8rem;border:1px solid var(--line);border-radius:14px;font-size:.88rem;color:var(--muted)}
.trust b{display:block;color:var(--cream)}
.bundle{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;padding:1.4rem;border-radius:24px;background:var(--violet2);border:1px solid rgba(255,178,30,.35);margin-block:1rem 2rem}
.bundle .it{display:flex;align-items:center;gap:.8rem;max-width:230px}
.bundle img{width:68px;height:68px;border-radius:14px;object-fit:contain;background:#fff;flex:none}
.bundle .it b{font-size:.95rem;font-weight:600;display:block;line-height:1.25}
.bundle .plus{font-size:1.6rem;color:var(--marigold)}
.bundle .sum{margin-left:auto;text-align:right}
.bundle .sum b{font-family:var(--serif);font-weight:400;font-size:1.7rem;display:block}

/* cart & checkout */
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:2rem;align-items:start;padding-bottom:3rem}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:1rem;align-items:center;padding:1rem;background:var(--violet);border:1px solid var(--line);border-radius:18px;margin-bottom:.8rem}
.row img{width:96px;height:80px;object-fit:contain;background:#fff;border-radius:12px}
.row h3{font-family:var(--sans);font-weight:600;font-size:1.02rem}
.row .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:.4rem}
.link{background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;font-size:.88rem}
.link:hover{color:var(--rani)}
.sum-box{position:sticky;top:130px;padding:1.4rem;background:var(--violet);border:1px solid var(--line);border-radius:22px}
.sum-box h3{font-size:1.4rem;margin-bottom:1rem}
.ln{display:flex;justify-content:space-between;padding:.3rem 0;color:#eadcc0}
.ln.tot{border-top:1px dashed var(--line);margin-top:.5rem;padding-top:.8rem;font-size:1.25rem;font-weight:700;color:var(--cream)}
.ln .g{color:var(--leaf)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:.4rem 0 .2rem}
.bar i{display:block;height:100%;background:var(--glow);border-radius:99px}
.coupon{display:flex;gap:.5rem;margin:1rem 0}
.coupon input{flex:1;min-width:0}
input.f,textarea.f,select.f{width:100%;padding:.7rem .9rem;background:var(--night);border:1px solid var(--line);border-radius:12px;outline:none}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--marigold)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:flex;flex-direction:column;gap:.3rem;font-size:.9rem;color:var(--muted)}
.opt{display:flex;gap:.8rem;padding:.9rem 1rem;border:1px solid var(--line);border-radius:14px;cursor:pointer;align-items:flex-start}
.opt:has(input:checked){border-color:var(--marigold);background:rgba(255,178,30,.08)}
.opt input{margin-top:.35rem;accent-color:var(--marigold)}
.fbox{background:var(--violet);border:1px solid var(--line);border-radius:22px;padding:1.4rem;margin-bottom:1.2rem}
.fbox h3{font-size:1.3rem;margin-bottom:1rem}
.note{font-size:.85rem;color:var(--muted);margin-top:.8rem}
.check{display:flex;gap:.6rem;font-size:.92rem;align-items:flex-start;margin-top:1rem;color:#eadcc0}
.check input{margin-top:.3rem;accent-color:var(--marigold)}
.status{max-width:640px;margin:3rem auto;text-align:center;padding:2.6rem 1.6rem;background:var(--violet);border:1px solid var(--line);border-radius:30px}
.status .big{font-size:4rem}
.status h1{font-size:2.3rem;margin:.6rem 0}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--marigold);animation:sp 1s linear infinite;margin:3rem auto}

 ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>',

const artCache={};
function art(p,v=0){
  if(p.imgs&&p.imgs[v]) return p.imgs[v];
  if(p.img&&!v) return p.img;
  const k=p.id+'-'+v; if(artCache[k]) return artCache[k];
  const c=catOf(p.cat); let s=(p.id*7919+v*104729)%2147483647; const rnd=()=>(s=(s*48271)%2147483647)/2147483647;
  const cols=[c.c1,c.c2,'#ffd166','#ff5fa2','#5fe3ff']; let rays='',dots='';
  const cx=300+(rnd()-.5)*60, cy=215+(rnd()-.5)*30, n=18+(v*4);
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+rnd()*.2, r1=50, r2=120+rnd()*95;
    rays+=`<line x1='${(cx+Math.cos(a)*r1).toFixed(1)}' y1='${(cy+Math.sin(a)*r1).toFixed(1)}' x2='${(cx+Math.cos(a)*r2).toFixed(1)}' y2='${(cy+Math.sin(a)*r2).toFixed(1)}' stroke='${cols[i%5]}' stroke-width='${3+rnd()*3}' stroke-linecap='round' opacity='.9'/><circle cx='${(cx+Math.cos(a)*(r2+14)).toFixed(1)}' cy='${(cy+Math.sin(a)*(r2+14)).toFixed(1)}' r='${3+rnd()*4}' fill='${cols[(i+2)%5]}'/>`;}
  for(let i=0;i<46;i++) dots+=`<circle cx='${(rnd()*600).toFixed(0)}' cy='${(rnd()*500).toFixed(0)}' r='${(rnd()*2+.6).toFixed(1)}' fill='#fff' opacity='${(rnd()*.7+.2).toFixed(2)}'/>`;
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 500'><defs><radialGradient id='g' cx='50%' cy='42%' r='75%'><stop offset='0' stop-color='${c.c2}' stop-opacity='.55'/><stop offset='.6' stop-color='#1a0d3d'/><stop offset='1' stop-color='#0d0720'/></radialGradient></defs><rect width='600' height='500' fill='url(#g)'/>${dots}${rays}<text x='${cx.toFixed(0)}' y='${(cy+55).toFixed(0)}' font-size='150' text-anchor='middle'>${c.em}</text><rect x='0' y='440' width='600' height='60' fill='#0d0720' opacity='.55'/></svg>`;
  return artCache[k]='data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

/* ============================== CART LOGIC ============================== */
const cartItems=()=>Object.entries(state.cart).map(([id,q])=>({p:byId[id],q})).filter(x=>x.p&&x.q>0);
function totals(){
  const items=cartItems(); let sub=0,mrp=0,count=0;
  items.forEach(({p,q})=>{sub+=p.price*q;mrp+=p.mrp*q;count+=q});
  const pct=COUPONS[state.coupon]||0, off=Math.round(sub*pct/100), after=sub-off;
  const allFree=items.length&&items.every(x=>x.p.free);
  const ship=(!items.length||state.pickup||allFree||after>=CONFIG.freeShipAbove)?0:CONFIG.shipping;
  return {sub,mrp,count,off,pct,ship,total:after+ship,saved:mrp-sub+off,toFree:Math.max(0,CONFIG.freeShipAbove-after)};
}
function badge(){const n=totals().count;const b=$('#badge');b.textContent=n;b.style.display=n?'grid':'none'}
function addToCart(id,q=1){state.cart[id]=Math.min(99,(state.cart[id]||0)+q);save()}

/* ============================== RECOMMENDATIONS ============================== */
function recommend(ids,n=4,exclude=[]){
  const base=ids.map(i=>byId[i]).filter(Boolean), ex=new Set([...ids.map(Number),...exclude.map(Number)]), seed=base.reduce((a,b)=>a+b.id*17,0);
  return SHOP.filter(p=>!ex.has(p.id)).map(p=>{
    let s=(p.feat?1:0)+(p.img?.5:0)+((p.id*37+seed)%100)/100;
    base.forEach(b=>{ if(p.cat===b.cat) s+=3; const i=COMP[b.cat].indexOf(p.cat); if(i>-1) s+=4-i; if(p.brand===b.brand&&p.brand!=='Other') s+=1; });
    return {p,s};
  }).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.p);
}
function bundleFor(p){const seen=new Set([p.cat]),out=[];for(const r of recommend([p.id],14)){if(!seen.has(r.cat)){seen.add(r.cat);out.push(r)}if(out.length===2)break}return out}

function tick(){
  const el=$('#cd-d'); if(!el) return;
  let ms=new Date(CONFIG.diwaliDate)-Date.now(); if(ms<0) ms=0;
  const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
  $('#cd-d').textContent=d;$('#cd-h').textContent=String(h).padStart(2,'0');$('#cd-m').textContent=String(m).padStart(2,'0');$('#cd-s').textContent=String(s).padStart(2,'0');
}

function qs(o){const u=new URLSearchParams();Object.entries(o).forEach(([k,v])=>{if(v&&v!=='all'&&!(k==='sort'&&v==='pop')&&!(k==='page'&&+v===1))u.set(k,v)});const s=u.toString();return s?'?'+s:''}
const inRange=(p,r)=>r==='all'||(r==='u75'&&p<75)||(r==='75'&&p>=75&&p<150)||(r==='150'&&p>=150&&p<300)||(r==='300'&&p>=300);
const SORTS={pop:['Featured',(a,b)=>(b.feat-a.feat)||(a.id-b.id)],lh:['Price: low to high',(a,b)=>a.price-b.price],hl:['Price: high to low',(a,b)=>b.price-a.price],disc:['Biggest discount',(a,b)=>disc(b)-disc(a)],name:['Name: A to Z',(a,b)=>a.name.localeCompare(b.name)]};
const PER=24;

function pageShop(q){

  const term=f.q.toLowerCase();
  const list=SHOP.filter(p=>(f.cat==='all'||p.cat===f.cat)&&inRange(p.price,f.price)&&(f.brand==='all'||p.brand===f.brand)&&(!term||(p.name+' '+p.brand+' '+catOf(p.cat).name).toLowerCase().includes(term))).sort((SORTS[f.sort]||SORTS.pop)[1]);
  const pages=Math.max(1,Math.ceil(list.length/PER)), pg=Math.min(f.page,pages), view=list.slice((pg-1)*PER,pg*PER);
  const c=catOf(f.cat), title=term?`Results for "${esc(f.q)}"`:(c?c.name:'All crackers');
  const U=o=>'#/shop'+qs({...f,page:1,...o});

  return `<div class="wrap">
  <div class="page-h"><div class="crumbs"><a href="#/">Home</a> / <a href="#/shop">Shop</a>${c?` / ${c.name}`:''}</div><h1>${title}</h1></div>
  <div class="mini-sale"><span><b>Diwali sale:</b> up to ${MAXOFF}% off. Use <span class="code">DIWALI10</span> for 10% extra.</span><a class="btn sm" style="width:auto" href="${U({sort:'disc'})}">Sort by discount</a></div>
  <div class="chips"><a class="chip ${f.cat==='all'?'on':''}" href="${U({cat:'all'})}">All</a>${CATS.map(x=>`<a class="chip ${f.cat===x.id?'on':''}" href="${U({cat:x.id})}">${x.em} ${x.name}</a>`).join('')}</div>

    <div style="display:flex;gap:1.2rem;flex-wrap:wrap">
      <label>Brand <select data-filter="brand"><option value="all">All brands</option>${BRANDS.map(b=>`<option value="${esc(b)}" ${f.brand===b?'selected':''}>${esc(b)}</option>`).join('')}</select></label>
      <label>Price <select data-filter="price"><option value="all">Any price</option>${[['u75','Under ₹75'],['75','₹75 to ₹149'],['150','₹150 to ₹299'],['300','₹300 and above']].map(([v,t])=>`<option value="${v}" ${f.price===v?'selected':''}>${t}</option>`).join('')}</select></label>
      <label>Sort by <select data-filter="sort">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}" ${f.sort===k?'selected':''}>${v[0]}</option>`).join('')}</select></label>

/* order details for the shop owner, sent on WhatsApp after the customer pays (PayQ itself only knows the order ID and amount) */
function orderMessage(o){
  const L=['*New order '+o.id+'* - '+CONFIG.brand,'Name: '+o.name,'Phone: '+o.phone,'','Items:'];
  o.items.forEach(i=>L.push('- '+i.name+' x '+i.qty+' = '+fmt(i.price*i.qty)));
  L.push('','Subtotal: '+fmt(o.sub)); if(o.off) L.push('Coupon '+o.coupon+': -'+fmt(o.off));
  L.push((o.pickup?'Store pickup: ':'Delivery: ')+(o.ship?fmt(o.ship):'Free'),'*Total: '+fmt(o.total)+'*','');
  L.push(o.pickup?'Collect from store':'Deliver to: '+o.address);
  L.push('Payment: paid by UPI'+(o.utr?', UTR '+o.utr:''));
  return L.join('\n');
}

  if(mine&&mine.paid){
    const first=!mine.sent;
    if(first){ mine.sent=true; store.set('dk_last',mine); }
    state.cart={};state.coupon='';save();
    app.innerHTML=`<div class="wrap"><div class="status"><div class="big">🎆</div><h1>Order placed, Shubh Deepavali!</h1>
      <p class="muted">Order ID <b style="color:var(--cream)">${esc(id)}</b><br>${mine.pickup?'Collect from our Vastrapur store':'We will deliver to '+esc(mine.address)}</p>
      <p style="margin-top:1rem;font-size:1.2rem">Paid ${fmt(mine.total)}</p>
      <p class="note">We check every payment against our bank account, then confirm your order on WhatsApp. Tap the button below to send us your order details.</p>
      <div class="cta" style="justify-content:center"><a class="btn" target="_blank" rel="noopener" href="${esc(orderWaUrl(mine))}">Send order on WhatsApp</a><a class="btn ghost" href="#/shop">Keep shopping</a></div></div></div>`;
    if(first&&!CONFIG.demoMode) window.open(orderWaUrl(mine),'_blank');
  }else{
    app.innerHTML=`<div class="wrap"><div class="status"><div class="big">😕</div><h1>We could not confirm this payment</h1><p class="muted">Order ID ${esc(id)}. If money was debited, please WhatsApp us this order ID and do not pay again. Otherwise your cart is safe, you can try again.</p><div class="cta" style="justify-content:center"><a class="btn" target="_blank" rel="noopener" href="${esc(CONFIG.social.whatsapp)}">Chat on WhatsApp</a><a class="btn ghost" href="#/checkout">Try again</a></div></div></div>`;
  }

}

const notFound=()=>`<div class="wrap"><div class="empty" style="padding-block:6rem"><h3>We could not find that page</h3><p style="margin-top:1rem"><a class="btn" href="#/shop">Go to shop</a></p></div></div>`;

/* ============================== FIREWORKS ============================== */
let FW=null;
function stopFW(){if(FW){FW();FW=null}}
function startFW(){
  stopFW(); const cv=$('#fw'); if(!cv||matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const ctx=cv.getContext('2d'), dpr=Math.min(devicePixelRatio||1,2); let W,H,parts=[],rk=[],raf,last=0;
  const size=()=>{const r=cv.getBoundingClientRect();W=cv.width=r.width*dpr;H=cv.height=r.height*dpr}; size();
  const cols=['#ffc23d','#ff7a1a','#ff2e93','#38e1ff','#b388ff','#3ddc84','#ffffff'];
  const launch=(x,y)=>rk.push({x:x??(.08+Math.random()*.84)*W,y:H,ty:y??(.1+Math.random()*.42)*H,c:cols[Math.random()*cols.length|0]});
  const boom=(x,y,c)=>{const n=70+Math.random()*50|0,mix=Math.random()<.4;for(let i=0;i<n;i++){const a=Math.PI*2*i/n,s=(.8+Math.random()*3.4)*dpr;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:mix&&i%2?cols[Math.random()*cols.length|0]:c,r:(1+Math.random()*1.5)*dpr})}};
  const frame=ts=>{raf=requestAnimationFrame(frame);
    ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
    if(ts-last>900){last=ts;launch()}
    rk=rk.filter(r=>{r.y-=10*dpr;ctx.fillStyle=r.c;ctx.fillRect(r.x,r.y,2*dpr,9*dpr);if(r.y<=r.ty){boom(r.x,r.y,r.c);return false}return true});
    parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.035*dpr;p.vx*=.985;p.vy*=.985;p.l-=.012;if(p.l<=0)return false;ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();return true});ctx.globalAlpha=1};
  const click=e=>{const r=cv.getBoundingClientRect();launch((e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr)};
  const hero=$('#hero'); hero.addEventListener('click',click); window.addEventListener('resize',size);
  launch(W*.3,H*.25);launch(W*.7,H*.3); raf=requestAnimationFrame(frame);
  FW=()=>{cancelAnimationFrame(raf);hero.removeEventListener('click',click);window.removeEventListener('resize',size)};
}

/* ============================== ROUTER ============================== */
function route(){
  const h=location.hash.slice(1)||'/', [path,query]=h.split('?'), q=new URLSearchParams(query||''), parts=path.split('/').filter(Boolean), pg=parts[0]||'home';
  const app=$('#app'); stopFW(); closeDrawer(); $('#navLinks').classList.remove('open');
  let nav=pg;
  if(pg==='shop'&&q.get('sort')==='disc') nav='offers';
  $$('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===nav));
  if(pg==='order'){pageOrder(parts[1]||'');return}
  const pages={home:()=>pageHome(),shop:()=>pageShop(q),product:()=>pageProduct(+parts[1]),cart:()=>pageCart(),checkout:()=>pageCheckout(),contact:()=>pageContact()};
  app.innerHTML=(pages[pg]||notFound)();
  const p=pg==='product'?byId[+parts[1]]:null;
  document.title=(p?p.name+' - ':pg==='shop'?'Crackers - ':'')+'Dhamaka Fireworks, Ahmedabad';
  window.scrollTo(0,0);
  if(pg==='home'){startFW();tick()}
}

  $('#drawer').innerHTML=`<div class="dr-h"><h3>Added to your cart</h3><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="dr-b"><div class="added"><img src="${art(p)}" alt=""><div><b>${esc(p.name)}</b><div class="muted" style="font-size:.9rem">${esc(brandLabel(p))}</div></div></div>
  <h3 style="font-size:1.2rem;margin:1.4rem 0 .4rem">Goes well with this</h3>
  ${recs.map(r=>`<div class="rec"><a href="#/product/${r.id}"><img src="${art(r)}" alt=""></a><div><a href="#/product/${r.id}"><b>${esc(r.name)}</b></a><span class="muted" style="font-size:.9rem">${fmt(r.price)} <s>${fmt(r.mrp)}</s></span></div><button class="btn" data-act="add" data-id="${r.id}" data-quiet="1">Add</button></div>`).join('')}</div>

}
function closeDrawer(){$('#drawer').classList.remove('show');$('#ov').classList.remove('show')}

/* ============================== EVENTS ============================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return; const a=t.dataset.act, id=+t.dataset.id;
  if(a==='add'){const q=t.dataset.qty?(+$('#'+t.dataset.qty).textContent||1):1;addToCart(id,q);if(t.dataset.quiet){toast('Added to cart');openDrawer(id)}else openDrawer(id)}
  else if(a==='buy'){const q=+$('#'+t.dataset.qty).textContent||1;addToCart(id,q);location.hash='#/checkout'}
  else if(a==='addmany'){t.dataset.ids.split(',').forEach(i=>addToCart(+i,1));toast('3 items added to cart');location.hash='#/cart'}
  else if(a==='inc'||a==='dec'){state.cart[id]=(state.cart[id]||0)+(a==='inc'?1:-1);if(state.cart[id]<=0)delete state.cart[id];save();route()}
  else if(a==='rm'){delete state.cart[id];save();route()}
  else if(a==='pq'){const el=$('#pq');el.textContent=Math.max(1,Math.min(99,(+el.textContent)+(+t.dataset.d)))}
  else if(a==='thumb'){$('#mainimg').src=art(byId[id],+t.dataset.v);$$('.thumbs button').forEach(b=>b.classList.toggle('on',b===t))}
  else if(a==='coupon'){const c=$('#cpn').value.trim().toUpperCase();if(!c){state.coupon='';save();route();return}if(COUPONS[c]){state.coupon=c;save();toast(`Coupon ${c} applied`);route()}else toast('This coupon code is not valid')}
  else if(a==='close')closeDrawer();
});
$('#ov').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
document.addEventListener('change',e=>{
  const f=e.target.closest('[data-filter]');
  if(f){const q=new URLSearchParams((location.hash.split('?')[1])||'');q.delete('page');f.value&&f.value!=='all'?q.set(f.dataset.filter,f.value):q.delete(f.dataset.filter);const s=q.toString();location.hash='#/shop'+(s?'?'+s:'')}
  if(e.target.name==='mode'){state.pickup=e.target.value==='pickup';save();const u=readForm();route();restoreForm(u)}
});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim();location.hash='#/shop'+(v?'?q='+encodeURIComponent(v):'');e.target.blur()}});
$('#burger').addEventListener('click',()=>$('#navLinks').classList.toggle('open'));
function readForm(){const f=$('#coForm');return f?Object.fromEntries(new FormData(f)):{}}
function restoreForm(u){const f=$('#coForm');if(!f)return;['name','phone','email','address','city','state','pin'].forEach(k=>{if(u[k]&&f.elements[k])f.elements[k].value=u[k]});if(u.age)f.elements.age.checked=true}

/* ============================== PAYQ CHECKOUT ============================== */
function payqModal({amount,upi,expiresMs,onCancel}){
  const ov=document.createElement('div'); ov.className='pq-ov';
  ov.innerHTML=`<div class="pq-box"><h3>Pay with UPI</h3><div class="pq-amt">${fmt(amount)}</div>
    <div class="pq-qr" id="pqQr"></div>
    <p class="pq-st" id="pqSt">Waiting for payment... <span id="pqT"></span></p>
    <a class="btn" id="pqApp" href="${esc(upi)}">Open UPI app</a>
    <button class="btn ghost" type="button" id="pqX">Cancel</button>
    <p class="note">Scan with any UPI app. Do not close this window until it says paid.</p></div>`;
  document.body.appendChild(ov);
  if(window.QRCode) new QRCode(ov.querySelector('#pqQr'),{text:upi,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});
  else ov.querySelector('#pqQr').textContent='QR failed to load, use the button below.';
  const tEl=ov.querySelector('#pqT'), end=Date.now()+expiresMs;
  const tick=setInterval(()=>{const s=Math.max(0,Math.round((end-Date.now())/1000));tEl.textContent='('+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+')'},500);
  const api={ el:ov, expired:()=>Date.now()>end, say:t=>ov.querySelector('#pqSt').textContent=t,
    close:()=>{clearInterval(tick);ov.remove()} };
  ov.querySelector('#pqX').onclick=()=>{api.close();onCancel&&onCancel()};
  return api;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ============================== MANUAL UPI CHECKOUT (pay to your own UPI ID) ============================== */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function upiModal({amount,orderId,onPaid,onCancel}){
  const link='upi://pay?pa='+encodeURIComponent(CONFIG.upiId)+'&pn='+encodeURIComponent(CONFIG.upiName)
    +'&am='+Number(amount).toFixed(2)+'&cu=INR&tn='+encodeURIComponent('Order '+orderId);
  const ov=document.createElement('div'); ov.className='pq-ov';
  ov.innerHTML=`<div class="pq-box"><h3>Pay with UPI</h3><div class="pq-amt">${fmt(amount)}</div>
    <div class="pq-qr" id="pqQr"></div>
    <p class="pq-st">Order ${esc(orderId)}</p>
    <a class="btn" href="${esc(link)}">Open UPI app</a>
    <p class="pq-st">After paying, enter the 12 digit UPI reference (UTR) from your payment app:</p>
    <input id="pqUtr" inputmode="numeric" maxlength="12" placeholder="12 digit UTR" style="width:100%;padding:.8rem;border-radius:12px;border:1px solid var(--line);background:transparent;color:inherit;text-align:center;font-size:1.1rem">
    <p class="note" id="pqErr" style="color:#ff8a8a;min-height:1.2em"></p>
    <button class="btn" type="button" id="pqOk">I have paid</button>
    <button class="btn ghost" type="button" id="pqX">Cancel</button>
    <p class="note">Your order is confirmed after we verify the payment in our bank account.</p></div>`;
  document.body.appendChild(ov);
  if(window.QRCode) new QRCode(ov.querySelector('#pqQr'),{text:link,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});
  else ov.querySelector('#pqQr').textContent='QR failed to load, use the button below.';
  ov.querySelector('#pqOk').onclick=()=>{
    const u=ov.querySelector('#pqUtr').value.trim();
    if(!/^\d{12}$/.test(u)) return ov.querySelector('#pqErr').textContent='Enter the 12 digit UTR number.';
    ov.remove(); onPaid(u);
  };
  ov.querySelector('#pqX').onclick=()=>{ov.remove();onCancel&&onCancel()};
}

document.addEventListener('submit',async e=>{
  if(e.target.id!=='coForm') return; e.preventDefault();
  const f=e.target, d=Object.fromEntries(new FormData(f)), err=$('#formErr'), btn=$('#payBtn'); err.textContent='';
  if(!d.name.trim()) return err.textContent='Please enter your name.';
  if(!/^[6-9]\d{9}$/.test(d.phone)) return err.textContent='Enter a valid 10 digit mobile number.';
  if(!/^\S+@\S+\.\S+$/.test(d.email)) return err.textContent='Enter a valid email address.';
  if(!state.pickup){ if(!d.address.trim()) return err.textContent='Please enter your delivery address.'; if(!d.city.trim()) return err.textContent='Please enter your city.'; if(!d.state) return err.textContent='Please select your state.'; if(CONFIG.blockedStates.includes(d.state)) return err.textContent='Sorry, we cannot deliver to '+d.state+'. Please choose store pickup or another address.'; if(!/^\d{6}$/.test(d.pin)) return err.textContent='Enter a valid 6 digit pincode.'; }
  if(!d.age) return err.textContent='Please confirm that you are 18 or older.';
  store.set('dk_user',{name:d.name,phone:d.phone,email:d.email,address:d.address||'',city:d.city||'',state:d.state||'',pin:d.pin||''});
  const t=totals(), addr=state.pickup?'':`${d.address}, ${d.city}, ${d.state} ${d.pin}`;
  const reset=()=>{btn.disabled=false;btn.textContent='Pay '+fmt(t.total)+' with UPI'};
  const items=cartItems().map(({p,q})=>({name:p.name,qty:q,price:p.price}));
  const id=(CONFIG.demoMode?'DEMO':'DK')+Date.now().toString(36).toUpperCase();
  const order={id,name:d.name.trim(),phone:d.phone,email:d.email.trim(),pickup:state.pickup,address:addr,coupon:state.coupon,
    items,sub:t.sub,off:t.off,ship:t.ship,total:t.total,paid:false,utr:''};
  store.set('dk_last',order);
  const done=utr=>{const o=store.get('dk_last',order);o.paid=true;o.utr=utr||'';store.set('dk_last',o);location.hash='#/order/'+id};
  btn.disabled=true; btn.textContent='Opening payment...';
  if(CONFIG.demoMode){ await sleep(900); done('DEMO'); return; }
  upiModal({amount:t.total,orderId:id,onPaid:done,onCancel:reset});
});
